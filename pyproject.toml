[project]
name = "prowlarr-mcp"
version = "0.2.0"
description = "An MCP server for Prowlarr"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
    "fastmcp>=3.4.4",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.11.0",
]

[project.scripts]
prowlarr-mcp = "prowlarr_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyrefly>=1.1.1",
    "ruff>=0.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/prowlarr_mcp"]

[tool.pyrefly]
preset = "strict"
project-includes = ["src/**/*.py", "tests/**/*.py"]
min-severity = "warn"

[tool.ruff.lint]
extend-select = [
    "B",
    "C4",
    "E",
    "F",
    "FA",
    "FURB",
    "I",
    "ISC",
    "PTH",
    "RET",
    "SIM",
    "TC",
    "TID",
    "W",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
docstring-code-format = true
